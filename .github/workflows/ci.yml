name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend dependencies
        run: dotnet restore FileExploler.BackEnd/FileExploler.Api/FileExploler.Api.csproj

      - name: Build backend
        run: dotnet build FileExploler.BackEnd/FileExploler.Api/FileExploler.Api.csproj --configuration Release --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: npm install
        working-directory: FileExploler.FrontEnd

      - name: Build frontend
        run: npm run build
        working-directory: FileExploler.FrontEnd
